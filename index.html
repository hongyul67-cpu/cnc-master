<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNC·컴퓨터응용가공</title>
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:16px 14px 90px}

  header{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .card .body{color:#333}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}
  .cd{font-family:"Consolas","D2Coding",monospace;background:#eef2f7;border-radius:5px;
      padding:1px 6px;font-weight:700;color:#0f2f6b;white-space:nowrap}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .qnum{color:var(--dim);font-size:13px;font-weight:700}
  .qtext{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.5}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
          border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .choice:hover{border-color:var(--pri)}
  .choice.correct{border-color:var(--ok);background:#eafaf1}
  .choice.wrong{border-color:var(--no);background:#fdeeee}
  .choice.picked{border-width:2px}
  .explain{background:#f8fafc;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;
           padding:10px 14px;margin-top:10px;color:#334}
  .progress{height:8px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}

  .empty{color:var(--dim);text-align:center;padding:34px 10px}
  .score{font-size:34px;font-weight:900;letter-spacing:-1px}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}
  .pill.lathe{background:#e8f1ff;color:#1d4ed8}
  .pill.mct{background:#eafaf1;color:#0d7a3d}

  /* 단원 접기 */
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .unit > summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:800;font-size:15px;
                  display:flex;justify-content:space-between;gap:10px;align-items:center}
  .unit > summary::-webkit-details-marker{display:none}
  .unit[open] > summary{border-bottom:1px solid var(--line);background:#fafbfc}
  .unit .inner{padding:4px 18px 14px}
  .unit .inner .card{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 0;margin:0}
  .unit .inner .card:last-child{border-bottom:0}

  /* 코드 도감 */
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.codes{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
  table.codes th,table.codes td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  table.codes th{background:#f2f5f9;font-size:13px;color:var(--dim);position:sticky;top:0}
  table.codes td.c{font-family:"Consolas","D2Coding",monospace;font-weight:800;color:#0f2f6b;white-space:nowrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);
        cursor:pointer;font-size:13px;font-weight:700;color:var(--dim)}
  .chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
  input.search{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}

  /* 계산 게임 */
  .calcbox{font-size:17px;line-height:2.1}
  input.num{width:130px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
            font-size:16px;font-weight:700;text-align:right}
  .formula{background:#f8fafc;border-left:3px solid var(--pri);padding:10px 14px;border-radius:0 8px 8px 0;
           font-family:"Consolas","D2Coding",monospace;margin:10px 0}

  /* 프로그램 조립 */
  .blk{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;
       margin-bottom:7px;cursor:pointer;font-family:"Consolas","D2Coding",monospace;font-size:14px;font-weight:700}
  .blk:hover{border-color:var(--pri)}
  .blk.used{opacity:.35;cursor:default}
  .slot{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;
        font-family:"Consolas","D2Coding",monospace;font-size:14px;color:var(--dim);background:#fafbfc}
  .slot.filled{border-style:solid;background:var(--card);color:var(--tx);font-weight:700;cursor:pointer}
  .slot.ok{border-color:var(--ok);background:#eafaf1}
  .slot.bad{border-color:var(--no);background:#fdeeee}
  .gamecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
            margin-bottom:12px;cursor:pointer}
  .gamecard:hover{border-color:var(--pri)}
  .gamecard h3{margin:0 0 4px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>CNC·컴퓨터응용가공 마스터</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="learn">📖 배우기</button>
    <button class="tab"    data-view="atlas">📇 G·M 코드 도감</button>
    <button class="tab"    data-view="game">🎮 게임</button>
    <button class="tab"    data-view="practice">✏️ 연습 8문항</button>
    <button class="tab"    data-view="exam">🏁 종합시험 20문항</button>
    <button class="tab"    data-view="wrong">📕 오답노트</button>
  </div>

  <div id="view"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   CNC·컴퓨터응용가공 마스터
   규약: https://github.com/hongyul67-cpu/links/blob/master/CONVENTIONS.md

   내용 출처 (모두 눈으로 읽고 옮긴 것) —
     · 한국산업인력공단 훈련교재 「CNC 공작법」 (270쪽)
     · 한국산업인력공단 훈련교재 「머시닝센터 기초실기 (SYSTEM 100M)」 (160쪽)
     · 한국산업인력공단 훈련교재 「머시닝센터 응용실기」 (120쪽)
     · 한국산업인력공단 훈련교재 「판금 공작 일반」 (299쪽)
     · 한국산업인력공단 훈련교재 「컴퓨터응용설계」 (265쪽)
     · NCS 일학습병행자격 문제원형 「CNC절삭가공사_L4」 (능력단위·수행준거)
   교재 본문·그림은 옮기지 않았고, 문항은 전부 새로 썼습니다.
   고칠 곳은 LEARN / CODES / PROGRAMS / QUESTIONS 네 배열입니다.
   ══════════════════════════════════════════════════════════════ */

var TOOL = 'CNC·컴퓨터응용가공';

/* ── 1) 배우기 — 정답을 다 보여 주는 단계. 테스트보다 반드시 앞에 ── */
var LEARN = [

/* ═══ 1단원 ═══ */
{ unit:'1단원 CNC 공작기계의 개요', t:'NC 와 CNC 는 무엇이 다른가', body:
  'NC 는 <span class="kw">Numerical Control</span>(수치제어)의 약어로, ' +
  '<b>“공작물에 대한 공구의 위치를 그에 대응하는 수치정보로 지령하는 제어”</b>를 말합니다.<br>' +
  'CNC 는 <span class="kw">Computerized Numerical Control</span> — 즉 <b>컴퓨터를 내장한 NC</b> 입니다. ' +
  '이런 CNC 장치가 붙은 공작기계를 <b>CNC 공작기계</b>라고 부릅니다.<br><br>' +
  'CNC 공작기계에는 CNC 선반 · CNC 밀링 · 머시닝센터 · 터닝센터 · 복합가공기 · ' +
  'CNC 와이어 컷 머신 · CNC 방전가공기 · CNC 보링머신 · CNC 연삭기 · CNC 드릴링 머신 · ' +
  'CNC 레이저 컷 머신 · CNC 워터 제트 머신 등이 있습니다. ' +
  '거의 모든 공작기계에 CNC 장치를 붙여 쓰고 있습니다.' },

{ unit:'1단원 CNC 공작기계의 개요', t:'가공은 어떤 순서로 이루어지는가 (정보의 흐름)', body:
  '외우기보다 <b>순서를 그림처럼</b> 기억하세요.' +
  '<div class="formula">도면 → CNC 프로그램 작성 → 입력 → 제어장치가 처리<br>' +
  ' → <b>펄스(pulse) 신호</b> 출력 → <b>서보모터</b> 구동<br>' +
  ' → 서보모터에 결합된 <b>볼 스크루(ball screw)</b> 회전<br>' +
  ' → 테이블·주축헤드가 요구한 위치·속도로 이동 → 자동 가공</div>' +
  '제어장치가 내보내는 것은 <span class="kw">펄스 신호</span>이고, 그 펄스를 실제 움직임으로 바꾸는 것이 ' +
  '<span class="kw">서보모터 + 볼 스크루</span>라는 점이 핵심입니다.' },

{ unit:'1단원 CNC 공작기계의 개요', t:'CNC 공작기계의 구성', body:
  'CNC 공작기계는 다음으로 구성됩니다.<br>' +
  '① <b>정보처리회로(CNC 장치)</b> · ② <b>데이터의 입·출력장치</b> · ③ <b>강전 제어반</b> · ' +
  '④ <b>유압유닛</b> · ⑤ <b>서보모터</b> · ⑥ <b>기계 본체</b>' },

{ unit:'1단원 CNC 공작기계의 개요', t:'왜 CNC 를 쓰는가 (필요성과 용도)', body:
  '제품의 <span class="kw">라이프 사이클</span>이 짧아지고, 고급화로 부품이 고정밀·복잡해지면서 ' +
  '<b>다품종 소량생산</b> 방식이 요구됩니다. 인건비 상승으로 자동화도 빨라지고 있습니다.<br><br>' +
  '이때 필요한 것은 <b>생산설비(hard ware)를 바꾸지 않고 프로그램(soft ware)만 바꿔</b> ' +
  '다양한 제품을 균일하게 만들 수 있는 기계입니다. 그것이 CNC 공작기계입니다.<br><br>' +
  '그래서 CNC 공작기계는 <b>다품종 소량생산</b>, 그리고 <b>항공기 부품처럼 복잡한 부품</b>의 가공에 적합합니다.' },

{ unit:'1단원 CNC 공작기계의 개요', t:'자동화의 단계 — DNC · FMC · FMS', body:
  '<b>DNC</b> (Distributed / Direct numerical control)<br>' +
  '· <i>Distributed</i> — CAD/CAM 시스템과 CNC 기계를 <b>근거리 통신망(LAN)</b>으로 연결해, ' +
  '컴퓨터 1대가 여러 대의 CNC 공작기계에 데이터를 <b>분배</b>하여 동시에 운전하는 방식.<br>' +
  '· <i>Direct</i> — 기계에 내장된 메모리를 쓰지 않고 컴퓨터와 기계를 통신기기로 연결해 ' +
  '프로그램을 <b>주고받으며 가공</b>하는 방식. Semi-DNC 라고도 부릅니다.<br><br>' +
  '<b>FMC</b> (Flexible manufacturing cell) — <b>한 대</b>의 CNC 공작기계에 로봇·자동공급장치 등을 ' +
  '갖춰 무인화한 <b>셀</b>.<br><br>' +
  '<b>FMS</b> (Flexible manufacturing system) — 공작기계 + 핸들링 로봇 + ' +
  '<b>APC</b>(자동 팔레트 교환장치) + <b>ATC</b>(자동 공구교환장치) + ' +
  '<b>AGV</b>(무인 운반차) + 자동창고 를 갖추고 <b>중앙 컴퓨터에서 제어</b>하는 유연 생산 시스템. ' +
  '다품종 소량생산에 적합합니다.' },

/* ═══ 2단원 ═══ */
{ unit:'2단원 CNC 의 제어 시스템', t:'제어방식 3가지 — 무엇을 어디에 쓰는가', body:
  '<b>① 위치결정 제어</b> — 이동 중 속도제어 없이 <b>최종 위치만</b> 찾아가는 방식. ' +
  '점에서 점으로 간다고 해서 <span class="kw">PTP(point to point)</span> 라고도 합니다.<br>' +
  '&nbsp;&nbsp;쓰는 곳 : <b>드릴링 머신 · 스폿 용접기 · 펀치 프레스</b><br><br>' +
  '<b>② 직선절삭 제어</b> — 직선으로 이동하면서 절삭. 서보모터 하나에 위치와 속도를 함께 제어하고 ' +
  '공구 보정·속도변화·공구선택 기능이 더해집니다. <b>직선 외에는 절삭할 수 없습니다.</b><br>' +
  '&nbsp;&nbsp;쓰는 곳 : <b>밀링 머신 · 보링 머신 · 선반</b><br><br>' +
  '<b>③ 윤곽절삭 제어</b> — <b>2개 이상의 서보모터를 연동</b>시켜 위치와 속도를 제어합니다. ' +
  '대각선·S자·원형 등 어떤 경로도 연속 절삭할 수 있고, 동시 3축을 제어하면 3차원 형상도 가공됩니다. ' +
  '<b>최근의 CNC 공작기계는 대부분 이 방식</b>입니다.' },

{ unit:'2단원 CNC 의 제어 시스템', t:'서보기구 4가지 — 어디서 되먹임(피드백)하는가', body:
  '서보기구란 구동모터의 <b>회전속도와 위치를 피드백</b>시켜 입력량과 출력량이 같아지도록 제어하는 기구입니다. ' +
  '4가지를 가르는 기준은 <b>“피드백 장치가 있는가, 있다면 어디서 검출하는가”</b> 하나뿐입니다.<br><br>' +
  '<b>① 개방회로(open loop)</b> — <b>피드백 장치가 없고</b> 스테핑 모터를 사용. ' +
  '정밀도에 문제가 있어 <b>현재는 거의 쓰이지 않습니다.</b><br><br>' +
  '<b>② 반폐쇄회로(semi-closed loop)</b> — <b>서보모터 쪽</b>에 붙은 위치검출기(엔코더)에서 위치를, ' +
  '타코 제너레이터에서 속도를 검출. 높은 정밀도의 볼 스크루가 개발되어 ' +
  '<b>현재 CNC 공작기계에 가장 많이 쓰입니다.</b><br><br>' +
  '<b>③ 폐쇄회로(closed loop)</b> — 속도는 모터에서, 위치는 <b>기계의 테이블에 부착한 스케일</b>에서 검출. ' +
  '기계 쪽 오차까지 보정할 수 있어, 가공물 무게로 볼 스크루에 처짐·비틀림·열변형이 생기는 ' +
  '<b>대형 기계</b>에 주로 씁니다.<br><br>' +
  '<b>④ 복합회로(hybrid)</b> — 반폐쇄회로와 폐쇄회로를 결합. <b>고가</b>라서 고정밀도를 요구하는 기계에만 씁니다.<br><br>' +
  '피드백 장치에는 <b>리졸버 · 엔코더</b>(근래 많이 씀)가 있고, 위치만 검출하는 ' +
  '<b>스케일</b>(광학·인덕션·레이저)도 있습니다.' },

{ unit:'2단원 CNC 의 제어 시스템', t:'이송기구 — 볼 스크루와 리니어 모터', body:
  '<b>볼 스크루(ball screw)</b> — 수나사와 암나사 사이에서 <b>강구가 굴러</b> 이동이 부드럽고 마찰계수가 작습니다. ' +
  '특히 <b>더블너트 방식</b>은 볼 스크루 자체의 <span class="kw">백래시</span>를 조절해 거의 0 에 가깝게 만들 수 있습니다. ' +
  '다만 강성이 낮은 단점이 있습니다.<br>' +
  '서보모터에서 볼 스크루로 동력을 전달하는 방법은 <b>타이밍 벨트 · 기어 · 커플링</b> 3가지입니다.<br><br>' +
  '<b>리니어 모터</b> — 볼 스크루는 고속 이송 시 <b>발열에 의한 열팽창</b>이 문제입니다. ' +
  '리니어 모터는 <b>직접 구동</b> 방식이라 경량화·구조 단순화·고속이송·고정도·고강성의 장점이 있습니다. ' +
  '회전형 모터의 고정자와 회전자를 잘라 펼쳐 놓은 형태가 곧 리니어 모터입니다.' },

/* ═══ 3단원 ═══ */
{ unit:'3단원 CNC 프로그램의 구성', t:'워드 · 블록 · 전개번호', body:
  '<b>어드레스(주소, 영문자) + 수치 = 워드(word)</b>, 워드가 모이면 <b>블록(지령절)</b>, ' +
  '블록의 끝은 <span class="cd">;</span> (EOB) 로 맺습니다.' +
  '<div class="formula">N10 G50 X150.0 Z200.0 S1500 T0100 ;<br>' +
  'N20 G96 S120 M03 ;<br>' +
  'N30 G00 X62.0 Z0.0 T0101 M08 ;</div>' +
  '<b>전개번호 N</b> — 영문자 <span class="cd">N</span> 다음에 4자리 이내의 숫자. ' +
  '매 블록마다 붙이지 않아도 되고 없어도 프로그램은 돌아갑니다. ' +
  '다만 <b>복합 반복 사이클(G70~G73 등)</b>에서 전개번호로 특정 블록을 찾아야 할 때는 <b>반드시 필요</b>합니다.' },

{ unit:'3단원 CNC 프로그램의 구성', t:'준비기능 G — 1회 유효와 연속 유효', body:
  '준비기능은 제어장치의 기능을 동작할 <b>준비</b>를 시키는 기능으로, 영문자 <span class="cd">G</span> 와 ' +
  '두 자리 숫자로 씁니다. 두 가지로 나뉩니다.<br><br>' +
  '<b>① 1회 유효 G코드 (One shot G-code)</b> — <b>지령된 블록에서만</b> 유효. → <b>“00” 그룹</b><br>' +
  '<b>② 연속 유효 G코드 (Modal G-code)</b> — 같은 그룹의 다른 G코드가 지령될 때까지 계속 유효. ' +
  '→ <b>“00” 이외의 그룹</b><br><br>' +
  '<b>같은 블록에 여러 개 쓸 수 있는가?</b><br>' +
  '· 그룹이 <b>서로 다르면</b> 한 블록에 몇 개라도 지령할 수 있습니다.<br>' +
  '· <b>같은 그룹</b>을 한 블록에 둘 이상 지령하면 <b>뒤에 지령한 것만 유효</b>하거나 알람이 발생합니다.<br>' +
  '· 일람표에 없는 G코드를 지령하면 <b>알람이 발생</b>합니다.' },

{ unit:'3단원 CNC 프로그램의 구성', t:'주축기능 S — G96 과 G97', body:
  '주축의 회전속도를 지령하는 기능으로 <span class="cd">S</span> 를 쓰며, ' +
  '반드시 G96 또는 G97 과 <b>함께</b> 지령합니다.' +
  '<div class="formula">G96 → 주축 <b>절삭속도</b> 일정제어 (m/min)<br>' +
  'G97 → 주축 <b>회전수</b> 일정제어 (rpm)</div>' +
  '<b>왜 두 개가 필요한가?</b> 효율적으로 절삭하려면 절삭속도가 일정해야 합니다. ' +
  '그런데 절삭속도는 <b>지름의 영향</b>을 받습니다. 그래서 지름을 알 수 있는 가공에서는 ' +
  '<b>절삭속도(G96)</b> 로 지령하는 것이 바람직하고, 지름을 알 수 없으면 회전수를 계산해 ' +
  '<b>G97</b> 로 지령합니다.<br><br>' +
  '<b>예)</b> <span class="cd">G96 S100 M03 ;</span> → 절삭속도 100 m/min 로 일정하게 시계방향 회전<br>' +
  '<span class="cd">G97 S1000 M03 ;</span> → 1000 rpm 으로 시계방향 회전<br><br>' +
  '전원을 넣을 때는 <b>안전을 위해 G97</b> 이 설정되도록 파라미터에 지정해 씁니다.<br>' +
  'G96 으로 지령하면 지름이 작아질수록 아주 빠르게 회전해야 하므로, ' +
  '<b>G50 으로 주축 최고 회전수를 제한</b>해 두어야 스핀들이 과열로 손상되지 않습니다.' },

{ unit:'3단원 CNC 프로그램의 구성', t:'이송기능 F — 선반과 머시닝센터가 반대다', body:
  '이송속도를 지령하는 기능으로 <span class="cd">F</span> 를 씁니다. ' +
  '<b>선반과 머시닝센터의 코드가 다르니 헷갈리지 마세요.</b>' +
  '<div class="formula"><b>CNC 선반</b><br>' +
  '&nbsp;&nbsp;G98 — 분당 이송 (mm/min)<br>' +
  '&nbsp;&nbsp;G99 — 회전당 이송 (mm/rev) ← 전원 공급 시 자동 설정<br><br>' +
  '<b>머시닝센터</b><br>' +
  '&nbsp;&nbsp;G94 — 분당 이송 (mm/min) ← 전원 공급 시 자동 설정<br>' +
  '&nbsp;&nbsp;G95 — 회전당 이송 (mm/rev)</div>' +
  '선반은 <b>회전당 이송</b>을, 머시닝센터는 <b>분당 이송</b>을 초기 설정으로 씁니다.<br>' +
  '날이 하나인 선반은 “한 바퀴에 얼마”가 자연스럽고, 날이 여러 개인 밀링계는 “1분에 얼마”가 자연스럽기 때문입니다.' },

{ unit:'3단원 CNC 프로그램의 구성', t:'공구기능 T — 선반과 머시닝센터의 차이', body:
  '공구를 선택하는 기능으로 <span class="cd">T</span> 와 숫자를 씁니다.<br><br>' +
  '<b>CNC 선반</b> — <span class="cd">T □□ ○○</span><br>' +
  '&nbsp;&nbsp;앞 두 자리 □□ = <b>공구 선택번호</b> (01~99)<br>' +
  '&nbsp;&nbsp;뒤 두 자리 ○○ = <b>공구 보정번호</b> (01~99, <b>00 은 보정 취소</b>)<br>' +
  '&nbsp;&nbsp;예) <span class="cd">T0101</span> = 1번 공구 · 1번 보정 &nbsp;/&nbsp; ' +
  '<span class="cd">T0100</span> = 1번 공구 · 보정 취소<br><br>' +
  '<b>머시닝센터</b> — <span class="cd">T__ M06 ;</span><br>' +
  '&nbsp;&nbsp;T 는 <b>공구를 고르기만</b> 하고, 실제로 바꾸는 것은 <b>M06(공구교환)</b> 입니다. ' +
  '<b>M06 없이 지령하면 에러</b>가 납니다.' },

{ unit:'3단원 CNC 프로그램의 구성', t:'보조기능 M — 기계의 스위치를 켜고 끈다', body:
  '보조기능은 스핀들 모터를 비롯한 기계의 각종 보조장치를 <b>ON/OFF</b> 하는 기능으로, ' +
  '<span class="cd">M</span> 과 두 자리 숫자를 씁니다.' +
  '<div class="formula">M00 프로그램 정지 &nbsp;|&nbsp; M01 선택 프로그램 정지<br>' +
  'M02 프로그램 끝 &nbsp;|&nbsp; M30 프로그램 끝 &amp; Rewind<br>' +
  'M03 주축 정회전 &nbsp;|&nbsp; M04 주축 역회전 &nbsp;|&nbsp; M05 주축 정지<br>' +
  'M08 절삭유 ON &nbsp;|&nbsp; M09 절삭유 OFF<br>' +
  'M98 보조프로그램 호출 &nbsp;|&nbsp; M99 보조프로그램 종료</div>' +
  '<b>M01(선택 정지)</b> 은 조작판의 M01 스위치가 <b>ON 일 때만</b> 멈춥니다.<br>' +
  '예전에는 한 블록에 M 을 하나만 쓸 수 있었고 둘 이상 쓰면 뒤엣것만 유효했지만, ' +
  '최근 제어장치는 한 블록에 여러 개를 쓸 수 있습니다.<br><br>' +
  '<b>보조프로그램 호출</b> — <span class="cd">M98 P____ L__ ;</span><br>' +
  '&nbsp;&nbsp;P = 보조프로그램 번호, L = 반복 횟수(생략하면 1회)<br>' +
  '&nbsp;&nbsp;예) <span class="cd">M98 P11 L5 ;</span> → 보조프로그램 O0011 을 불러 <b>5회 반복</b><br>' +
  '&nbsp;&nbsp;보조프로그램 끝에는 <span class="cd">M99</span> 를 써서 주 프로그램으로 돌아갑니다.' },

/* ═══ 4단원 ═══ */
{ unit:'4단원 절삭조건 — 계산이 나오는 곳', t:'절삭속도 V 와 회전수 N', body:
  '<b>절삭속도</b>란 가공물과 절삭공구 사이의 <b>상대속도</b>로, ' +
  '1분 동안 공구인선이 가공물을 지나가는 거리를 m 단위로 나타냅니다. ' +
  '절삭능률·표면거칠기·공구수명에 직접 영향을 줍니다.' +
  '<div class="formula">V = π D N / 1000 &nbsp;(m/min)<br><br>' +
  'N = 1000 V / (π D) &nbsp;(rpm)<br><br>' +
  'D : 가공물 또는 공구의 지름 (mm)<br>N : 회전수 (rpm)</div>' +
  '실무에서는 공구 제작회사가 <b>추천하는 절삭속도</b>를 쓰고, 거기에 지름을 넣어 ' +
  '<b>회전수를 계산해서</b> 지령합니다.<br><br>' +
  '<b>예)</b> 지름 50 mm 가공물을 추천 절삭속도 120 m/min 로 가공한다면<br>' +
  'N = 1000 × 120 ÷ (3.14 × 50) ≒ <b>764 rpm</b>' },

{ unit:'4단원 절삭조건 — 계산이 나오는 곳', t:'이송속도 — 날이 여러 개일 때 (F = f<sub>z</sub> · Z · N)', body:
  '이송속도는 공구와 가공물 사이의 <b>가로방향 상대운동</b> 크기입니다.<br><br>' +
  '· <b>CNC 선반</b> — 날이 하나이므로 <b>회전당 이송</b>(mm/rev) 을 주로 씁니다.<br>' +
  '· <b>머시닝센터</b> — 날이 2개 이상이므로 <b>분당 이송</b>(mm/min) 을 주로 쓰고 다음처럼 계산합니다.' +
  '<div class="formula">F = f<sub>z</sub> × Z × N &nbsp;(mm/min)<br><br>' +
  'f<sub>z</sub> : 날 하나당 이송 (mm/tooth)<br>Z : 공구의 날수<br>N : 회전수 (rpm)</div>' +
  '<b>예)</b> 지름 20 mm 4날 엔드밀, 추천 절삭속도 50 m/min, 이송 0.1 mm/tooth 라면<br>' +
  'N = 1000 × 50 ÷ (3.14 × 20) ≒ 796 rpm<br>' +
  'F = 0.1 × 4 × 796 ≒ <b>318 mm/min</b><br><br>' +
  '<b>절입 깊이</b>는 공구가 가공물을 절삭할 때 <b>가공하는 방향에 수직으로 측정한 깊이</b>입니다.' },

{ unit:'4단원 절삭조건 — 계산이 나오는 곳', t:'절삭공구 재료와 코팅', body:
  '<b>초경합금</b> — 텅스텐 탄화물(WC) 을 주성분으로 티탄(TiC)·탄탈(TaC) 등의 탄화물 분말을 ' +
  '코발트(Co) 로 결합해 1400 ℃ 이상의 고온에서 압축 성형·소결한 합금. ' +
  '경도가 높고 고온에서도 경도 저하가 크지 않으며 압축강도가 강합니다.<br><br>' +
  '용도에 따라 <b>P · M · K</b> 계열로 나눕니다.<br>' +
  '· <b>P</b> — 긴 칩이 생기는 <b>강</b> 재료용 (WC + TiC + TaC + Co)<br>' +
  '· <b>M</b> — 긴 칩이 생기며 <b>크레이터</b>(공구 윗면 패임)를 유발하는 재료용<br>' +
  '· <b>K</b> — 칩이 <b>가루이거나 짧은</b> 재료, 절삭저항이 적은 재료용 (WC + Co)<br><br>' +
  '<b>코팅 재료</b><br>' +
  '· <b>TiC</b>(탄화티탄) — <b>여유면</b>의 내마모성 우수, 경사면은 약함<br>' +
  '· <b>TiN</b>(질화티탄) — <b>내용착성 우수, 구성인선 발생 방지</b>, 다듬면 거칠기 우수<br>' +
  '· <b>Al<sub>2</sub>O<sub>3</sub></b>(알루미나) — <b>경사면</b>의 내마모성 우수, 여유면은 약함<br><br>' +
  '<b>코팅 방법</b><br>' +
  '· <b>CVD</b>(화학적 증착) — 가스의 화학반응으로 코팅, 코팅 온도 통상 <b>1000 ℃ 전후</b><br>' +
  '· <b>PVD</b>(물리적 증착) — 이온으로 물리적으로 코팅, 코팅 온도 통상 <b>500 ℃ 이하</b>' },

/* ═══ 5단원 ═══ */
{ unit:'5단원 CNC 선반 — 좌표계와 원점복귀', t:'프로그램 원점과 좌표계 설정 (G50)', body:
  'CNC 선반에서 가공하는 부품은 주로 <b>회전체</b>이므로 프로그램 원점을 ' +
  '<b>중심을 기준으로</b> 정하는 것이 일반적이고, 도면에 원점 표시기호를 넣어 ' +
  '작업자가 원점 위치를 알 수 있게 합니다.<br><br>' +
  '공구가 출발하는 임의의 위치를 <b>시작점</b>이라 하고, 프로그램 원점과 시작점의 관계를 ' +
  'NC 에 알려 주는 것을 <b>좌표계 설정</b>이라고 합니다.' +
  '<div class="formula">G50 X__ Z__ S__ ;<br><br>' +
  'X, Z : 시작점의 좌표<br>S : 주축 <b>최고</b> 회전수 제한</div>' +
  '<b>예)</b> <span class="cd">G50 X150.0 Z150.0 S1200 ;</span><br>' +
  '→ 시작점은 원점에서 X방향 150 mm, Z방향 150 mm 인 점이고, ' +
  '주축 최고 회전수는 <b>1200 rpm 으로 제한</b>됩니다.' },

{ unit:'5단원 CNC 선반 — 좌표계와 원점복귀', t:'기계원점과 원점복귀 (G28 · G30 · G27 · G29)', body:
  'CNC 공작기계는 각 이송축마다 고유의 <b>기계원점</b>을 갖고 있고, 이 점이 공구교환 위치나 ' +
  '프로그램의 모든 좌표를 결정하는 <b>기준</b>이 됩니다. 이를 흔히 <b>제1원점</b>이라 합니다.<br><br>' +
  '<b>전원을 켰을 때</b>나 <b>비상정지 스위치를 눌렀을 때</b>는 <b>반드시 기계 원점복귀</b>를 시켜야 합니다. ' +
  '최초 복귀는 수동으로 하고 그 뒤부터는 자동 원점복귀를 씁니다.' +
  '<div class="formula">G28 — 자동 원점복귀 (제1원점)<br>' +
  'G30 — 제2 · 제3 · 제4 원점복귀<br>' +
  'G27 — 원점복귀 확인(Check)<br>' +
  'G29 — 원점으로부터 복귀</div>' +
  '<b>G28 은 경유점을 지나서</b> 복귀합니다. 공구가 가공물과 충돌하는 것을 피하기 위해서입니다.<br>' +
  '· <span class="cd">G28 U0 W0 ;</span> — 현 지점을 경유해 X·Z축이 원점복귀. ' +
  '<b>가장 많이 쓰는 방법</b>입니다.<br>' +
  '· <span class="cd">G28 X0 Z0 ;</span> — 절대좌표의 <b>원점</b>을 경유해 복귀. ' +
  '<b>충돌 위험이 있어 바람직하지 않습니다.</b><br><br>' +
  'G27 은 지령된 위치가 기계원점이면 원점복귀 램프가 켜지고, 맞지 않으면 <b>알람이 발생</b>합니다.' },

{ unit:'5단원 CNC 선반 — 좌표계와 원점복귀', t:'절대지령과 증분지령 — X·Z 와 U·W', body:
  '<b>절대지령</b>은 <b>원점에서 본</b> 좌표를, <b>증분지령</b>은 <b>지금 있는 자리에서</b> ' +
  '얼마나 움직일지를 나타냅니다. CNC 선반에서는 어드레스로 구분합니다.' +
  '<div class="formula"><b>CNC 선반</b>&nbsp;&nbsp;절대지령 : X , Z &nbsp;&nbsp;|&nbsp;&nbsp; 증분지령 : U , W<br>' +
  '<b>머시닝센터</b>&nbsp;&nbsp;절대지령 : G90 &nbsp;&nbsp;|&nbsp;&nbsp; 증분지령 : G91</div>' +
  '같은 “절대·증분”인데 <b>선반은 어드레스로, 머시닝센터는 G코드로</b> 구분한다는 점을 꼭 기억하세요.<br>' +
  '선반은 한 블록에 절대와 증분을 <b>섞어</b> 쓸 수도 있습니다 (예: <span class="cd">X50.0 W-20.0 ;</span>).' },

/* ═══ 6단원 ═══ */
{ unit:'6단원 CNC 선반 — 보간 · 나사 · 보정', t:'보간기능 — G00 · G01 · G02 · G03', body:
  '<div class="formula">G00 — 위치결정 (<b>급속이송</b>)<br>' +
  'G01 — 직선보간 (<b>절삭이송</b>)<br>' +
  'G02 — 원호보간 (<b>시계방향 CW</b>)<br>' +
  'G03 — 원호보간 (<b>반시계방향 CCW</b>)<br>' +
  'G04 — 휴지 (dwell)</div>' +
  '<b>G00</b> 은 가공을 위해 공구를 일정한 위치로 옮기는 지령으로, 파라미터에 지정된 ' +
  '<b>급속이송 속도</b>로 아주 빠르게 움직입니다. 그래서 <b>공구가 가공물이나 기계에 충돌하지 않도록 ' +
  '특히 주의</b>해야 합니다. G00 에는 F(이송속도)를 쓰지 않습니다.<br><br>' +
  '<b>원호보간</b>은 원호의 반지름 <span class="cd">R</span> 로 지령하거나, ' +
  '시작점에서 원호 중심까지의 <b>벡터량</b> <span class="cd">I · J · K</span> 로 지령합니다 ' +
  '(I = X축, J = Y축, K = Z축 벡터량).<br>' +
  '· 벡터량은 절대·증분에 관계없이 <b>항상 증분값</b>으로 지령합니다.<br>' +
  '· R 로 지령할 때 <b>180° 를 넘는 원호</b>는 R 을 <b>음(−)의 값</b>으로 씁니다.' },

{ unit:'6단원 CNC 선반 — 보간 · 나사 · 보정', t:'나사가공 — G32 · G92 · G76', body:
  '나사는 한 번에 깎을 수 없어 여러 번 반복해야 합니다. 그래서 세 가지 방법이 있습니다.' +
  '<div class="formula">G32 — 나사 절삭 (한 줄씩 직접 지령)<br>' +
  'G92 — 나사 절삭 <b>사이클</b> (단일형 고정 사이클)<br>' +
  'G76 — 나사 절삭 <b>복합 반복 사이클</b> (한 번 지령으로 끝)</div>' +
  '<b>G32 · G92 · G76</b> — CNC 선반의 나사가공에 쓰이는 G코드는 이 셋입니다.<br><br>' +
  '나사를 깎을 때는 회전수가 변하면 피치가 틀어지므로, ' +
  '반드시 <b>G97(주축 회전수 일정제어)</b> 로 지령합니다. ' +
  '홈가공·드릴작업처럼 <b>일정 회전수가 필요한 작업</b>도 마찬가지입니다.' },

{ unit:'6단원 CNC 선반 — 보간 · 나사 · 보정', t:'공구인선 반지름 보정 — G40 · G41 · G42', body:
  '<div class="formula">G40 — 공구 인선 반지름 보정 <b>취소</b><br>' +
  'G41 — 공구 인선 반지름 보정 <b>좌측</b><br>' +
  'G42 — 공구 인선 반지름 보정 <b>우측</b></div>' +
  '진행 방향을 보고 공구가 <b>왼쪽</b>에 있으면 G41, <b>오른쪽</b>에 있으면 G42 입니다.<br>' +
  '보정을 켰으면 가공이 끝난 뒤 <b>반드시 G40 으로 취소</b>합니다.' },

{ unit:'6단원 CNC 선반 — 보간 · 나사 · 보정', t:'가상인선이란 무엇인가', body:
  '보통 공구 선단에는 <b>인선 R(nose R)</b> 이 있습니다. ' +
  '그런데 프로그램을 짤 때는 <b>이 인선이 없다고 생각하고</b> 뾰족한 한 점으로 보고 작성합니다. ' +
  '이 가상의 점을 <span class="kw">가상인선</span>이라고 합니다.<br><br>' +
  '<b>무엇이 문제인가?</b> 직선 구간은 괜찮지만 <b>테이퍼나 원호를 가공할 때 ' +
  '과대절삭·과소절삭</b>이 생깁니다. 인선 R 만큼 실제 접촉점이 달라지기 때문입니다.<br><br>' +
  '<b>그래서</b> 공구 인선 반지름 보정(G41 · G42)으로 이를 <b>보정</b>합니다.' },

/* ═══ 7단원 ═══ */
{ unit:'7단원 CNC 선반 — 사이클 가공', t:'왜 사이클을 쓰는가 · 단일형 (G90 · G94)', body:
  '거친 절삭이나 나사 절삭은 <b>1회의 절삭으로 불가능</b>해서 여러 번 반복해야 합니다. ' +
  '이 반복을 <b>G코드 하나로 간단히</b> 처리하는 것이 <b>고정 사이클</b>입니다.<br><br>' +
  '· <b>단일형 고정 사이클</b> — 변경된 수치만 반복 지령<br>' +
  '· <b>복합형 반복 사이클</b> — 한두 블록의 지령으로 끝<br><br>' +
  '<b>단일형</b>' +
  '<div class="formula">G90 — 안·바깥지름 절삭 사이클 (직선 / 테이퍼)<br>' +
  'G94 — 단면 절삭 사이클 (직선 / 테이퍼)</div>' +
  'G90 은 <span class="cd">G90 X__ Z__ F__ ;</span> 로 지령하고, 다음 줄부터는 ' +
  '<b>바뀌는 X 값만</b> 써 주면 그만큼 반복 절삭합니다.' },

{ unit:'7단원 CNC 선반 — 사이클 가공', t:'복합형 반복 사이클 (G70 ~ G76)', body:
  '<div class="formula">G70 — 다듬절삭 사이클<br>' +
  'G71 — <b>안·바깥지름 거친절삭</b> 사이클<br>' +
  'G72 — 단면 거친절삭 사이클<br>' +
  'G73 — 형상 반복 사이클<br>' +
  'G74 — Z방향 홈 가공 사이클 (펙 드릴링)<br>' +
  'G75 — X방향 홈 가공 사이클<br>' +
  'G76 — 나사 절삭 사이클</div>' +
  '가장 많이 쓰는 짝이 <b>G71(거친절삭) → G70(다듬절삭)</b> 입니다.<br><br>' +
  '<b>G71 의 어드레스</b><br>' +
  '· <b>U(Δd)</b> 1회 가공깊이(절삭깊이) — 반지름 지령<br>' +
  '· <b>R(e)</b> 도피량 — 절삭 후 간섭 없이 공구가 빠지기 위한 양<br>' +
  '· <b>P(ns)</b> 다듬절삭 지령절의 <b>첫</b> 전개번호<br>' +
  '· <b>Q(nf)</b> 다듬절삭 지령절의 <b>마지막</b> 전개번호<br>' +
  '· <b>U(Δu)</b> X축 방향 다듬절삭 여유 (지름 지령)<br>' +
  '· <b>W(Δw)</b> Z축 방향 다듬절삭 여유' },

{ unit:'7단원 CNC 선반 — 사이클 가공', t:'F 값은 어느 것이 살아남는가 (자주 틀리는 곳)', body:
  '<b>G71(거친절삭)</b> 을 실행할 때 — ns ~ nf 블록 사이에 쓴 F 는 <b>무시</b>되고, ' +
  '<b>G71 블록에서 지령한 F</b> 가 유효합니다.<br><br>' +
  '<b>G70(다듬절삭)</b> 을 실행할 때 — G71 · G72 · G73 에서 지령한 F 는 <b>무시</b>되고, ' +
  '<b>전개번호 ns ~ nf 사이에서 지령한 F</b> 가 유효합니다.<br><br>' +
  '<div class="formula">거친절삭(G71) → <b>G71 블록의 F</b><br>' +
  '다듬절삭(G70) → <b>ns~nf 사이의 F</b></div>' +
  '이유를 생각하면 외우기 쉽습니다. 거친절삭은 형상과 무관하게 <b>한 가지 속도</b>로 밀어내면 되고, ' +
  '다듬절삭은 <b>구간마다 다른 속도</b>가 필요하기 때문입니다.<br><br>' +
  '또한 G71 · G72 · G73 사이클에서는 ns 와 nf 사이에 <b>보조프로그램을 호출할 수 없습니다.</b>' },

/* ═══ 8단원 ═══ */
{ unit:'8단원 머시닝센터', t:'머시닝센터란 · 절삭조건', body:
  '머시닝센터는 <b>자동 공구교환장치(ATC)</b> 를 갖추어 여러 공구로 밀링·드릴링·보링·태핑을 ' +
  '한 번의 설치로 끝내는 기계입니다. 주축이 수직이면 <b>수직형</b>, 수평이면 <b>수평형</b>입니다.<br><br>' +
  '수직형 머시닝센터는 가장 많이 쓰는 평면이 <b>X-Y 평면</b>이므로, ' +
  'G17(X-Y 평면)이 <b>전원 투입 시 자동 설정</b>되도록 파라미터에 지정해 씁니다. ' +
  '그래서 X-Y 가 아닌 다른 평면을 쓸 때만 지정하면 됩니다.<br><br>' +
  '이송은 <b>분당 이송(G94, mm/min)</b> 이 초기 설정이고, ' +
  '날이 여러 개이므로 <b>F = f<sub>z</sub> × Z × N</b> 으로 계산합니다.' },

{ unit:'8단원 머시닝센터', t:'평면 선택 — G17 · G18 · G19', body:
  '<div class="formula">G17 — <b>X-Y 평면</b> (전원 투입 시 자동 설정)<br>' +
  'G18 — Z-X 평면<br>' +
  'G19 — Y-Z 평면</div>' +
  '원호가공을 할 때는 가공물의 형상에 맞는 <b>작업평면을 먼저 선택</b>해야 합니다. ' +
  '평면을 잘못 고르면 원호가 엉뚱한 방향으로 그려집니다.<br><br>' +
  '회전방향(G02 시계 / G03 반시계)은 <b>선택한 평면에 수직인 축의 +방향에서 내려다보며</b> 정합니다.' },

/* ═══ 9단원 ═══ */
{ unit:'9단원 머시닝센터 프로그래밍', t:'공작물 좌표계 — G54 ~ G59', body:
  '머시닝센터는 테이블에 <b>여러 개의 공작물</b>을 올려놓고 가공하는 일이 잦습니다. ' +
  '그래서 공작물 좌표계를 <b>6개까지 미리 등록</b>해 두고 골라 씁니다.' +
  '<div class="formula">G54 — 공작물 좌표계 1번 &nbsp;|&nbsp; G55 — 2번 &nbsp;|&nbsp; G56 — 3번<br>' +
  'G57 — 4번 &nbsp;|&nbsp; G58 — 5번 &nbsp;|&nbsp; G59 — 6번<br><br>' +
  'G92 — 공작물 좌표계 설정 &nbsp;|&nbsp; G52 — 로컬(구역) 좌표계 설정</div>' +
  '<b>CNC 선반의 G50 과 머시닝센터의 G92 가 같은 “좌표계 설정”</b> 자리라는 점을 함께 기억하세요. ' +
  '(머시닝센터에서 G50 은 스켈링·미러 기능 무시입니다.)' },

{ unit:'9단원 머시닝센터 프로그래밍', t:'절대·증분지령 — G90 과 G91', body:
  '<div class="formula">G90 — <b>절대</b>지령 (원점에서 본 좌표)<br>' +
  'G91 — <b>증분</b>지령 (지금 자리에서 움직일 양)</div>' +
  '<b>예)</b> A(−30, −30) 에서 B(30, −15) 로 직선 절삭한다면<br>' +
  '· 절대 : <span class="cd">G01 G90 X30.0 Y-15.0 F100 ;</span><br>' +
  '· 증분 : <span class="cd">G01 G91 X60.0 Y15.0 F100 ;</span><br><br>' +
  '같은 움직임인데 숫자가 다릅니다. 증분은 <b>“차이”</b> 를 쓰기 때문입니다 ' +
  '(30 −(−30) = 60, −15 −(−30) = 15).' },

{ unit:'9단원 머시닝센터 프로그래밍', t:'공구경 보정과 공구길이 보정 — D 와 H', body:
  '머시닝센터에는 <b>두 종류</b>의 보정이 있습니다. <b>보정번호 어드레스가 다릅니다.</b>' +
  '<div class="formula"><b>공구경(지름) 보정</b> — 옆면을 얼마나 비켜 갈 것인가<br>' +
  '&nbsp;&nbsp;G41 좌측 / G42 우측 / G40 취소 &nbsp;— 보정번호 <b>D</b><br><br>' +
  '<b>공구길이 보정</b> — 공구마다 다른 길이를 맞춰 줌<br>' +
  '&nbsp;&nbsp;G43 “+” / G44 “−” / G49 취소 &nbsp;— 보정번호 <b>H</b></div>' +
  '<b>D 는 지름(Diameter), H 는 높이(Height)</b> 로 외우면 헷갈리지 않습니다.<br>' +
  '공구를 바꾸면 길이가 달라지므로, 머시닝센터에서는 <b>공구교환 뒤 G43 으로 길이 보정</b>을 걸어 줍니다.' },

{ unit:'9단원 머시닝센터 프로그래밍', t:'단위계 — G20 과 G21', body:
  '<div class="formula">G20 — <b>inch</b> 입력<br>G21 — <b>metric</b>(mm) 입력</div>' +
  '프로그램의 단위계를 지령하는 코드입니다. ' +
  '단위를 잘못 잡으면 25.4배 차이가 나므로 <b>사고로 직결</b>됩니다. ' +
  '보통 프로그램 맨 앞에서 <b>단독 블록</b>으로 한 번 지령합니다.' },

/* ═══ 10단원 ═══ */
{ unit:'10단원 머시닝센터 고정 사이클', t:'구멍 가공 고정 사이클 (G73 ~ G89)', body:
  '구멍을 뚫고·넓히고·나사를 내는 일은 <b>“빠르게 접근 → 천천히 절삭 → 빠지기”</b> 의 반복입니다. ' +
  '이 반복을 코드 하나로 처리하는 것이 <b>고정 사이클</b>입니다.' +
  '<div class="formula">G73 — 고속 심공드릴 사이클<br>' +
  'G74 — <b>왼나사</b> 탭 사이클<br>' +
  'G76 — 정밀 보링 사이클<br>' +
  'G80 — 고정 사이클 <b>취소</b><br>' +
  'G81 — 드릴링 사이클 (스폿 보링)<br>' +
  'G82 — 카운터 보링 사이클<br>' +
  'G83 — 심공드릴 사이클<br>' +
  'G84 — <b>탭</b> 사이클<br>' +
  'G85 · G86 · G88 · G89 — 보링 사이클<br>' +
  'G87 — 백보링 사이클</div>' +
  '<b>G80 을 빼먹으면</b> 고정 사이클이 계속 살아 있어 엉뚱한 곳에 구멍이 뚫립니다. ' +
  '반드시 취소해 주세요.' },

{ unit:'10단원 머시닝센터 고정 사이클', t:'구멍 가공 뒤 어디로 돌아오는가 — G98 · G99', body:
  '<div class="formula">G98 — 고정 사이클 <b>초기점</b> 복귀<br>' +
  'G99 — 고정 사이클 <b>R점</b> 복귀</div>' +
  '<b>초기점</b>은 사이클을 시작하기 전 공구가 있던 높이, <b>R점</b>은 급속이송에서 절삭이송으로 ' +
  '바뀌는 낮은 지점입니다.<br><br>' +
  '· 구멍 사이에 <b>턱이나 클램프 같은 장애물이 있으면 G98</b> — 높이 들어 올려 피해 갑니다.<br>' +

{ unit:'12단원 측정과 검사', t:'외워 둘 측정 원리 — 아베 · 테일러 · 측정불확도', body:

{ unit:'12단원 측정과 검사', t:'측정기를 다루고 보관하는 법', body:

{ unit:'13단원 판금 가공', t:'전단 · 굽힘 · 성형 — 판금 가공의 큰 갈래', body:

{ unit:'13단원 판금 가공', t:'프레스 브레이크의 특징', body:

{ unit:'13단원 판금 가공', t:'판재를 잇는 법 — 심(seam) 이음', body:

  '접합이 잘되면 판재와 <b>거의 같은 강도</b>를 유지하고 <b>수밀</b>도 유지할 수 있습니다.<br><br>' +

  '<b>심 여유</b> — 접는 데 필요한 여유로, 걸림 부분의 나비와 판재 두께로 정해집니다.' +
  '<div class="formula">두께 0.64 mm <b>이하</b> : 심 여유 = 3 × 심 나비<br>' +

{ unit:'13단원 판금 가공', t:'성형용 기계와 특수 가공', body:

var CFG = { practiceN:8, examN:20, storeKey:'cnc-master_v1' };

/* ══════════════ 여기부터는 대개 손대지 않습니다 ══════════════ */

function $(s){ return document.querySelector(s); }
function el(h){ var d=document.createElement('div'); d.innerHTML=String(h).trim(); return d.firstElementChild; }
function shuffle(a){ return a.map(function(v){return [Math.random(),v];})
                      .sort(function(x,y){return x[0]-y[0];})
                      .map(function(v){return v[1];}); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var ST = load();
function load(){
  try{ var o = JSON.parse(localStorage.getItem(CFG.storeKey)||'{}');
       return { wrong: o.wrong||[], done: o.done||{} }; }
  catch(e){ return {wrong:[],done:{}}; }
}
function save(){ try{ localStorage.setItem(CFG.storeKey, JSON.stringify(ST)); }catch(e){} }

var quiz = null;
var lastResult = null;

/* ── 화면 전환 ── */
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('on'); });
    t.classList.add('on');
    render(t.dataset.view);
    window.scrollTo(0,0);
  };
});
function go(view){
  var t = document.querySelector('[data-view="'+view+'"]');
  if(t) t.click();
}

function render(view){
  var v = $('#view');
  v.innerHTML = '';
  if(view==='learn')    return renderLearn(v);
  if(view==='atlas')    return renderAtlas(v);
  if(view==='game')     return renderGameMenu(v);
  if(view==='practice') return startQuiz(v,'practice');
  if(view==='exam')     return startQuiz(v,'exam');
  if(view==='wrong')    return renderWrong(v);
}

/* ── 배우기 — 단원별로 접어 둔다 ── */
function renderLearn(v){
  v.appendChild(el('<div class="card"><b>📖 먼저 여기부터 읽으세요.</b><br>' +
    '<span class="muted">단원 제목을 누르면 펼쳐집니다. 다 읽고 나서 게임과 문제로 넘어가면 훨씬 쉽습니다.</span></div>'));

  var units = [];
  LEARN.forEach(function(c){ if(units.indexOf(c.unit)<0) units.push(c.unit); });

  units.forEach(function(u, ui){
    var cards = LEARN.filter(function(c){ return c.unit===u; });
    var d = el('<details class="unit"' + (ui===0?' open':'') + '>' +
      '<summary><span>' + esc(u) + '</span><span class="pill">' + cards.length + '장</span></summary>' +
      '<div class="inner"></div></details>');
    var inner = d.querySelector('.inner');
    cards.forEach(function(c){
      inner.appendChild(el('<div class="card"><h3>' + c.t + '</h3><div class="body">' + c.body + '</div></div>'));
    });
    v.appendChild(d);
  });

  v.appendChild(el('<div class="card row"><b>다 읽었으면</b>' +
    '<button class="btn" id="goAtlas">📇 코드 도감 보기</button>' +
    '<button class="btn btn-primary" id="goGame">🎮 게임으로 익히기</button></div>'));
  $('#goAtlas').onclick = function(){ go('atlas'); };
  $('#goGame').onclick  = function(){ go('game'); };
}

/* ── G·M 코드 도감 ── */
var atlasFilter = '전체';
function renderAtlas(v){
  v.appendChild(el('<div class="card"><b>📇 G·M 코드 도감</b><br>' +
    '<span class="muted">같은 번호라도 <b>선반과 머시닝센터의 뜻이 다른 코드</b>가 있습니다. ' +
    '기계를 골라서 보세요.</span></div>'));

  var box = el('<div class="card"></div>');
  var f = el('<div class="filters"></div>');
  ['전체','선반','머시닝센터','공통'].forEach(function(k){
    var c = el('<button class="chip' + (atlasFilter===k?' on':'') + '">' + k + '</button>');
    c.onclick = function(){ atlasFilter = k; render('atlas'); };
    f.appendChild(c);
  });
  var si = el('<input class="search" placeholder="코드나 기능으로 찾기 (예: G71, 보정, 사이클)">');
  f.appendChild(si);
  box.appendChild(f);

  var wrap = el('<div class="tblwrap"><table class="codes"><thead><tr>' +
    '<th>코드</th><th>기계</th><th>그룹</th><th>기능</th><th>메모</th>' +
    '</tr></thead><tbody></tbody></table></div>');
  var tb = wrap.querySelector('tbody');
  box.appendChild(wrap);
  v.appendChild(box);

  function draw(){
    var q = si.value.trim().toLowerCase();
    tb.innerHTML = '';
    var rows = CODES.filter(function(r){
      if(atlasFilter!=='전체' && r.m!==atlasFilter) return false;
      if(!q) return true;
      return (r.c+' '+r.f+' '+r.n).toLowerCase().indexOf(q) >= 0;
    });
    if(!rows.length){
      tb.insertAdjacentHTML('beforeend','<tr><td colspan="5" class="muted">찾는 코드가 없습니다.</td></tr>');
      return;
    }
    /* <tr> 은 div 안에서 파서가 지워 버립니다. tbody 에 직접 넣어야 합니다. */
    tb.insertAdjacentHTML('beforeend', rows.map(function(r){
      var cls = r.m==='선반' ? 'lathe' : (r.m==='머시닝센터' ? 'mct' : '');
      return '<tr><td class="c">' + r.c + '</td>' +
        '<td><span class="pill ' + cls + '">' + r.m + '</span></td>' +
        '<td class="muted">' + r.grp + '</td>' +
        '<td>' + esc(r.f) + '</td>' +
        '<td class="muted">' + esc(r.n||'') + '</td></tr>';
    }).join(''));
  }
  si.oninput = draw;
  draw();
}

    {k:'blocks',t:'🧩 프로그램 조립', d:'뒤섞인 블록을 가공 순서대로 놓습니다. 순서를 몸으로 익히는 게임입니다.'}
  ];
  gs.forEach(function(g){
    var c = el('<div class="gamecard"><h3>' + g.t + '</h3><div class="muted">' + g.d + '</div></div>');

    v.appendChild(c);
  });

function startGame(k){
  var v = $('#view'); v.innerHTML=''; window.scrollTo(0,0);
  if(k==='code')   return startCodeGame(v);
  if(k==='calc')   return startCalcGame(v);
  if(k==='blocks') return startBlockGame(v);
}

/* ── 게임 1 · 코드 맞히기 ── */
function makeCodeQuestions(n){
  var pool = CODES.filter(function(r){ return r.f; });
  var out = [], used = {};
  var tries = 0;
  while(out.length < n && tries < 800){
    tries++;
    var r = pool[Math.floor(Math.random()*pool.length)];
    var key = r.m + r.c;
    if(used[key]) continue;
    // 같은 기계 안에서 오답을 뽑되, 기능이 같은 것은 제외한다
    var sameM = pool.filter(function(x){ return x.m===r.m && x.c!==r.c && x.f!==r.f; });
    if(sameM.length < 3) continue;
    used[key] = 1;
    var wrongs = shuffle(sameM).slice(0,3);
    var mode = Math.random() < 0.5 ? 'f2c' : 'c2f';
    if(mode==='f2c'){
      var chs = shuffle([r].concat(wrongs)).map(function(x){ return x.c; });
      out.push({ unit:'코드', q:'[' + r.m + '] <b>' + esc(r.f) + '</b> 을(를) 하는 코드는?',
                 ch:chs, a:chs.indexOf(r.c),
                 ex: r.c + ' — ' + r.f + (r.n ? ' (' + r.n + ')' : '') });
    }else{
      var chs2 = shuffle([r].concat(wrongs)).map(function(x){ return x.f; });
      out.push({ unit:'코드', q:'[' + r.m + '] <span class="cd">' + r.c + '</span> 의 기능은?',
                 ch:chs2, a:chs2.indexOf(r.f),
                 ex: r.c + ' — ' + r.f + (r.n ? ' (' + r.n + ')' : '') });
    }
  }
  return out;
}
function startCodeGame(v){
  quiz = { mode:'game', part:'코드 맞히기', i:0, correct:0, picks:[],
           list: makeCodeQuestions(20), startTime: Date.now() };
  drawQ(v);
}

/* ── 게임 2 · 절삭조건 계산 ── */
function makeCalcProblems(n){
  var out = [];
  var Ds  = [20,25,30,40,50,60,80,100];
  var Vs  = [60,80,100,120,150,160,200];
  var fzs = [0.05,0.08,0.1,0.12,0.15,0.2];
  var Zs  = [2,3,4,6];
  for(var i=0;i<n;i++){
    var t = i % 3;
    if(t===0){
      var D=Ds[Math.floor(Math.random()*Ds.length)], V=Vs[Math.floor(Math.random()*Vs.length)];
      out.push({ q:'지름 <b>'+D+' mm</b> 인 가공물을 절삭속도 <b>'+V+' m/min</b> 으로 가공하려 합니다.<br>' +
                    '주축 회전수 N 은 몇 rpm 인가? (π = 3.14, 소수점 이하 반올림)',
                 unitTx:'rpm',
                 ans: Math.round(1000*V/(3.14*D)),
                 f:'N = 1000 V / (π D)',
                 sol:'N = 1000 × '+V+' ÷ (3.14 × '+D+') = '+Math.round(1000*V/(3.14*D))+' rpm' });
    }else if(t===1){
      var fz=fzs[Math.floor(Math.random()*fzs.length)], Z=Zs[Math.floor(Math.random()*Zs.length)];
      var N=[400,500,600,800,1000,1200][Math.floor(Math.random()*6)];
      out.push({ q:'날수 <b>'+Z+'날</b> 엔드밀이 <b>'+N+' rpm</b> 으로 회전하고, ' +
                    '날 하나당 이송이 <b>'+fz+' mm/tooth</b> 입니다.<br>분당 이송속도 F 는 몇 mm/min 인가?',
                 unitTx:'mm/min',
                 ans: Math.round(fz*Z*N),
                 f:'F = f<sub>z</sub> × Z × N',
                 sol:'F = '+fz+' × '+Z+' × '+N+' = '+Math.round(fz*Z*N)+' mm/min' });
    }else{
      var D2=Ds[Math.floor(Math.random()*Ds.length)];
      var N2=[300,400,500,600,800,1000][Math.floor(Math.random()*6)];
      out.push({ q:'지름 <b>'+D2+' mm</b> 인 공구가 <b>'+N2+' rpm</b> 으로 회전합니다.<br>' +
                    '절삭속도 V 는 몇 m/min 인가? (π = 3.14, 소수점 이하 반올림)',
                 unitTx:'m/min',
                 ans: Math.round(3.14*D2*N2/1000),
                 f:'V = π D N / 1000',
                 sol:'V = 3.14 × '+D2+' × '+N2+' ÷ 1000 = '+Math.round(3.14*D2*N2/1000)+' m/min' });
    }
  }
  return shuffle(out);
}
function startCalcGame(v){
  quiz = { mode:'calc', part:'절삭조건 계산', i:0, correct:0, picks:[],
           list: makeCalcProblems(8), startTime: Date.now() };
  drawCalc(v);
}
function drawCalc(v){
  var p = quiz.list[quiz.i];
  v.innerHTML = '';
  v.appendChild(el('<div class="progress"><i style="width:'+(quiz.i/quiz.list.length*100)+'%"></i></div>'));
  var card = el('<div class="card">' +
    '<div class="qnum">'+(quiz.i+1)+' / '+quiz.list.length+
      ' <span class="pill" style="margin-left:6px">'+quiz.correct+'개 맞힘</span></div>' +
    '<div class="qtext">'+p.q+'</div>' +
    '<div class="formula">'+p.f+'</div>' +
    '<div class="calcbox row"><input class="num" id="calcIn" inputmode="numeric" placeholder="답">' +
      '<b>'+p.unitTx+'</b>' +
      '<button class="btn btn-primary" id="calcGo">채점</button></div>' +
    '<div id="exp"></div></div>');
  v.appendChild(card);

  var inp = card.querySelector('#calcIn');
  var btn = card.querySelector('#calcGo');
  inp.focus();
  inp.onkeydown = function(e){ if(e.key==='Enter' || e.keyCode===13) btn.click(); };

  btn.onclick = function(){
    if(btn.disabled) return;
    var raw = inp.value.trim();
    if(raw===''){ inp.focus(); return; }
    var mine = Number(raw);
    // 반올림 자리에서 1 정도 차이는 맞은 것으로 본다
    var ok = isFinite(mine) && Math.abs(mine - p.ans) <= 1;
    btn.disabled = true; inp.disabled = true;   // 채점은 1회
    quiz.picks.push({ q:p.q, mine: raw + ' ' + p.unitTx, right: p.ans + ' ' + p.unitTx, ok:ok, ex:p.sol });
    if(ok) quiz.correct++;
    else pushWrongFree('절삭조건 계산', p.q, raw + ' ' + p.unitTx, p.ans + ' ' + p.unitTx, p.sol);

    try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX',e); }

    var exp = card.querySelector('#exp');
    exp.appendChild(el('<div class="explain"><b>' + (ok?'맞았습니다':'정답은 '+p.ans+' '+p.unitTx) +
      '</b><br>' + p.sol + '</div>'));
    var nx = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">' +
      (quiz.i+1>=quiz.list.length ? '결과 보기' : '다음 문제 →') + '</button></div>');
    exp.appendChild(nx);
    nx.querySelector('button').onclick = function(){
      quiz.i++;
      if(quiz.i >= quiz.list.length) return finishFree(v);
      drawCalc(v);
    };
  };
}

/* ── 게임 3 · 프로그램 조립 ── */
function startBlockGame(v){
  var p = PROGRAMS[Math.floor(Math.random()*PROGRAMS.length)];
  var order = p.lines.map(function(_,i){ return i; });
  quiz = { mode:'blocks', part:'프로그램 조립', prog:p, order:order,
           picked:[], startTime: Date.now(), pool: shuffle(order.slice()) };
  drawBlocks(v);
}
function drawBlocks(v){
  var q = quiz, p = q.prog;
  v.innerHTML = '';
  v.appendChild(el('<div class="card"><b>🧩 ' + esc(p.title) + '</b><br>' +
    '<span class="muted">' + esc(p.hint) + '</span><br>' +
    '<span class="muted">아래 블록을 눌러 위쪽에 순서대로 채우세요. 잘못 놓았으면 위쪽 블록을 눌러 빼면 됩니다.</span></div>'));

  var top = el('<div class="card"><h3>내가 만든 프로그램</h3><div id="slots"></div></div>');
  v.appendChild(top);
  var slots = top.querySelector('#slots');
  for(var i=0;i<p.lines.length;i++){
    if(i < q.picked.length){
      var idx = q.picked[i];
      var s = el('<div class="slot filled">' + esc(p.lines[idx][0]) + '</div>');
      (function(pos){ s.onclick = function(){ if(q.graded) return; q.picked.splice(pos,1); drawBlocks(v); }; })(i);
      slots.appendChild(s);
    }else{
      slots.appendChild(el('<div class="slot">' + (i+1) + '번째 블록</div>'));
    }
  }

  if(q.picked.length < p.lines.length){
    var bot = el('<div class="card"><h3>남은 블록</h3><div id="pool"></div></div>');
    v.appendChild(bot);
    var pool = bot.querySelector('#pool');
    q.pool.forEach(function(idx){
      if(q.picked.indexOf(idx) >= 0) return;
      var b = el('<div class="blk">' + esc(p.lines[idx][0]) + '</div>');
      b.onclick = function(){ q.picked.push(idx); drawBlocks(v); };
      pool.appendChild(b);
    });
  }else{
    var go = el('<div class="card row"><button class="btn btn-primary" id="blkGo">채점하기</button>' +
      '<span class="muted">채점은 한 번만 합니다.</span></div>');
    v.appendChild(go);
    go.querySelector('#blkGo').onclick = function(){ gradeBlocks(v); };
  }
}
function gradeBlocks(v){
  var q = quiz, p = q.prog;
  q.graded = true;
  var correct = 0, wrongList = [];
  q.picked.forEach(function(idx,i){ if(idx===i) correct++; });
  var pct = Math.round(correct / p.lines.length * 100);
  var sec = Math.round((Date.now()-q.startTime)/1000);

  v.innerHTML = '';
  v.appendChild(el('<div class="card" style="text-align:center">' +
    '<div class="score">'+pct+'점</div>' +
    '<div class="muted">'+p.lines.length+'줄 중 '+correct+'줄을 제자리에 놓았습니다 · ' +
      Math.floor(sec/60)+'분 '+(sec%60)+'초</div>' +
    '<div id="rankBox" style="margin-top:12px"></div>' +
    '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));

  var res = el('<div class="card"><h3>바른 순서와 내가 놓은 순서</h3><div id="cmp"></div></div>');
  v.appendChild(res);
  var cmp = res.querySelector('#cmp');
  p.lines.forEach(function(ln,i){
    var mineIdx = q.picked[i];
    var ok = mineIdx === i;
    if(!ok) wrongList.push((i+1)+'번째 줄 → ' + p.lines[i][0]);
    cmp.appendChild(el('<div class="slot ' + (ok?'ok':'bad') + '">' +
      '<b>' + (i+1) + '. ' + esc(ln[0]) + '</b><br>' +
      '<span class="muted">' + esc(ln[1]) + '</span>' +
      (ok ? '' : '<br><span class="muted">내가 놓은 것 : ' + esc(p.lines[mineIdx][0]) + '</span>') +
      '</div>'));
  });
  if(wrongList.length){
    pushWrongFree('프로그램 조립', p.title + ' — 순서가 어긋난 줄',
      wrongList.length + '줄', '바른 순서는 결과 화면 참고', p.hint);
  }

  var again = el('<div class="card row"><button class="btn" id="blkAgain">다른 프로그램으로 다시</button>' +
    '<button class="btn" id="blkMenu">게임 메뉴로</button></div>');
  v.appendChild(again);
  again.querySelector('#blkAgain').onclick = function(){ startGame('blocks'); };
  again.querySelector('#blkMenu').onclick  = function(){ go('game'); };

  mountSubmit(pct, correct, p.lines.length, sec, '프로그램 조립', wrongList);
  celebrate(pct, '프로그램 조립');
}

/* ── 보기 섞기 ──
   QUESTIONS 는 정답을 0번에 두고 썼습니다. 그대로 내면 답이 늘 1번이 되므로
   풀 때마다 보기를 섞고 정답 번호를 다시 매깁니다. */
function prepQ(q){
  var right = q.ch[q.a];
  var ch = shuffle(q.ch.slice());
  return { unit:q.unit, q:q.q, ch:ch, a:ch.indexOf(right), ex:q.ex };
}

/* ── 객관식 문제 풀이 (연습 · 종합시험 · 코드 게임 공용) ── */
function startQuiz(v, mode){
  var n = mode==='exam' ? CFG.examN : CFG.practiceN;
  quiz = { mode:mode, part: mode==='exam' ? '종합시험' : '연습',
           i:0, correct:0, picks:[],
           list: shuffle(QUESTIONS.slice()).slice(0, Math.min(n, QUESTIONS.length)).map(prepQ),
           startTime: Date.now() };
  if(!quiz.list.length){ v.appendChild(el('<div class="empty">문항이 아직 없습니다.</div>')); return; }
  drawQ(v);
}

function drawQ(v){
  var q = quiz.list[quiz.i];
  var isExam = quiz.mode==='exam';
  v.innerHTML='';
  v.appendChild(el('<div class="progress"><i style="width:'+(quiz.i/quiz.list.length*100)+'%"></i></div>'));
  var card = el('<div class="card">' +
    '<div class="qnum">' + (quiz.i+1) + ' / ' + quiz.list.length +
      (isExam ? ' <span class="pill" style="margin-left:6px">채점은 마지막에</span>'
              : ' <span class="pill" style="margin-left:6px">' + quiz.correct + '개 맞힘</span>') +
      ' <span class="pill" style="margin-left:6px">' + esc(q.unit||'') + '</span></div>' +
    '<div class="qtext">' + q.q + '</div>' +
    '<div id="chs"></div><div id="exp"></div></div>');
  v.appendChild(card);

  var chs = card.querySelector('#chs');
  q.ch.forEach(function(c, idx){
    var b = el('<button class="choice">' + (idx+1) + '. ' + esc(c) + '</button>');
    b.onclick = function(){ pick(v, idx, b); };
    chs.appendChild(b);
  });
}

function pick(v, idx, btn){
  var q = quiz.list[quiz.i];
  var ok = idx === q.a;
  quiz.picks.push({ q:q, pick:idx, ok:ok });
  if(ok) quiz.correct++;
  else   pushWrong(q, idx);

  if(quiz.mode==='exam'){                 // 종합시험 — 아무 표시 없이 다음으로
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    return drawQ(v);
  }

  document.querySelectorAll('.choice').forEach(function(b,i){
    b.disabled = true;                    // 채점은 1회
    if(i===q.a) b.classList.add('correct');
    if(i===idx) { b.classList.add('picked'); b.classList.add(ok?'correct':'wrong'); }
  });
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }

  var exp = document.querySelector('#exp');
  exp.appendChild(el('<div class="explain"><b>' + (ok?'맞았습니다':'정답은 '+(q.a+1)+'번') +
    '</b><br>' + esc(q.ex||'') + '</div>'));
  var next = el('<div class="row" style="margin-top:12px"><button class="btn btn-primary">' +
    (quiz.i+1>=quiz.list.length ? '결과 보기' : '다음 문제 →') + '</button></div>');
  exp.appendChild(next);
  next.querySelector('button').onclick = function(){
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    drawQ(v);
  };
}

function pushWrong(q, pick){
  ST.wrong = ST.wrong.filter(function(w){ return w.q !== q.q; });
  ST.wrong.unshift({ unit:q.unit||'', q:q.q,
                     mine:(pick+1)+'. '+q.ch[pick], right:(q.a+1)+'. '+q.ch[q.a],
                     ex:q.ex||'', at:Date.now() });
  ST.wrong = ST.wrong.slice(0,100);
  save();
}
function pushWrongFree(unit, q, mine, right, ex){
  ST.wrong = ST.wrong.filter(function(w){ return w.q !== q; });
  ST.wrong.unshift({ unit:unit, q:q, mine:mine, right:right, ex:ex||'', at:Date.now() });
  ST.wrong = ST.wrong.slice(0,100);
  save();
}

/* ── 끝난 뒤 (객관식) ── */
function finish(v){
  var n   = quiz.list.length;
  var pct = Math.round(quiz.correct / n * 100);
  var sec = Math.round((Date.now() - quiz.startTime)/1000);
  var part = quiz.part;

  v.innerHTML = '';
  v.appendChild(el('<div class="card" style="text-align:center">' +
    '<div class="score">' + pct + '점</div>' +
    '<div class="muted">' + n + '문항 중 ' + quiz.correct + '개 정답 · ' +
      Math.floor(sec/60) + '분 ' + (sec%60) + '초</div>' +
    '<div id="rankBox" style="margin-top:12px"></div>' +
    '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));

  var bad = quiz.picks.filter(function(p){ return !p.ok; });
  if(bad.length){
    v.appendChild(el('<div class="card"><h3>📕 틀린 문제</h3></div>'));
    bad.forEach(function(p){
      v.appendChild(el('<div class="card">' +
        '<span class="pill">' + esc(p.q.unit||'') + '</span>' +
        '<div class="qtext">' + p.q.q + '</div>' +
        '<div class="muted">내가 고른 답 : ' + (p.pick+1) + '. ' + esc(p.q.ch[p.pick]) + '</div>' +
        '<div style="color:var(--ok);font-weight:700">정답 : ' + (p.q.a+1) + '. ' + esc(p.q.ch[p.q.a]) + '</div>' +
        '<div class="explain">' + esc(p.q.ex||'') + '</div></div>'));
    });
  }

  var wrongList = bad.map(function(p){
    return (p.q.unit||'') + ' ' + String(p.q.q).replace(/<[^>]+>/g,'').slice(0,24) + '… → 정답 ' + (p.q.a+1) + '번';
  });
  mountSubmit(pct, quiz.correct, n, sec, part, wrongList);
  celebrate(pct, part);
}

/* ── 끝난 뒤 (계산 게임) ── */
function finishFree(v){
  var n = quiz.list.length;
  var pct = Math.round(quiz.correct / n * 100);
  var sec = Math.round((Date.now() - quiz.startTime)/1000);
  var part = quiz.part;

  v.innerHTML = '';
  v.appendChild(el('<div class="card" style="text-align:center">' +
    '<div class="score">' + pct + '점</div>' +
    '<div class="muted">' + n + '문항 중 ' + quiz.correct + '개 정답 · ' +
      Math.floor(sec/60) + '분 ' + (sec%60) + '초</div>' +
    '<div id="rankBox" style="margin-top:12px"></div>' +
    '<div id="rSubmitAnchor" style="margin-top:12px"></div></div>'));

  var bad = quiz.picks.filter(function(p){ return !p.ok; });
  if(bad.length){
    v.appendChild(el('<div class="card"><h3>📕 틀린 문제</h3></div>'));
    bad.forEach(function(p){
      v.appendChild(el('<div class="card"><div class="qtext">' + p.q + '</div>' +
        '<div class="muted">내가 쓴 답 : ' + esc(p.mine) + '</div>' +
        '<div style="color:var(--ok);font-weight:700">정답 : ' + esc(p.right) + '</div>' +
        '<div class="explain">' + p.ex + '</div></div>'));
    });
  }
  var again = el('<div class="card row"><button class="btn" id="clcAgain">숫자를 바꿔 다시</button>' +
    '<button class="btn" id="clcMenu">게임 메뉴로</button></div>');
  v.appendChild(again);
  again.querySelector('#clcAgain').onclick = function(){ startGame('calc'); };
  again.querySelector('#clcMenu').onclick  = function(){ go('game'); };

  var wrongList = bad.map(function(p){
    return String(p.q).replace(/<[^>]+>/g,'').slice(0,28) + '… → 정답 ' + p.right;
  });
  mountSubmit(pct, quiz.correct, n, sec, part, wrongList);
  celebrate(pct, part);
}

/* 코드 맞히기는 객관식 엔진을 쓰므로 finish() 가 그대로 처리합니다.
   quiz.part 에 '코드 맞히기' 가 들어 있어 제출 이름이 갈립니다. */

function celebrate(pct, part){
  try{
    if(window.FX && pct >= 60){
      FX.banner({ title: pct>=90 ? '훌륭합니다!' : '통과!', sub: part + ' ' + pct + '점',
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      var res = Rank.award(pct, { mode: TOOL + ' — ' + part });
      var box = $('#rankBox'); if(box) box.innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
}

/* ── 결과 제출 (규약 1) — mode 는 파트마다 다르게 ── */
function mountSubmit(pct, correct, total, sec, part, wrongList){
  lastResult = { mode: TOOL + ' — ' + part, score: pct, correct: correct, total: total,
                 wrong: wrongList || [], durationSec: sec };
  var anchor = $('#rSubmitAnchor');
  if(!(window.ResultCollector && ResultCollector.attach) || !anchor) return;
  var btn = ResultCollector.attach(anchor, function(){ return lastResult; }, {
    id:'rcBtn', className:'btn btn-primary', mode: lastResult.mode,
    extra: [TOOL + ' ' + part + ' ' + pct + '점']
  });
  if(btn){ btn.style.width='100%'; btn.textContent = '📤 [' + part + '] 결과 제출'; }
}

/* ── 오답노트 ── */
function renderWrong(v){
  if(!ST.wrong.length){
    v.appendChild(el('<div class="empty">🗒️ 아직 오답이 없어요!<br>' +
      '게임·연습·종합시험을 풀면 여기에 모입니다.</div>'));
    return;
  }
  var head = el('<div class="card row"><b>' + ST.wrong.length + '개</b>' +
    '<button class="btn" id="clrWrong">비우기</button></div>');
  v.appendChild(head);
  head.querySelector('#clrWrong').onclick = function(){ ST.wrong=[]; save(); render('wrong'); };
  ST.wrong.forEach(function(w){
    v.appendChild(el('<div class="card">' +
      '<span class="pill">' + esc(w.unit||'') + '</span>' +
      '<div class="qtext">' + w.q + '</div>' +
      '<div class="muted">내가 쓴 답 : ' + esc(w.mine) + '</div>' +
      '<div style="color:var(--ok);font-weight:700">정답 : ' + esc(w.right) + '</div>' +
      '<div class="explain">' + (w.ex||'') + '</div></div>'));
  });
}

(function(){
  var units = [];
  LEARN.forEach(function(c){ if(units.indexOf(c.unit)<0) units.push(c.unit); });
  $('#hdSub').textContent = '배우기 ' + units.length + '단원 ' + LEARN.length + '장 · 코드 ' +
                            CODES.length + '개 · 게임 3 · 문항 ' + QUESTIONS.length;
})();
render('learn');
</script>
